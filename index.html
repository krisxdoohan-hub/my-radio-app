<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- ============================================================
       台灣廣播播放器 PWA  |  Taiwan Radio PWA
       單一 index.html — Vanilla JS + Tailwind CDN + Phosphor Icons
       作者備注：將此檔案與 manifest.json / sw.js 放同目錄即可運作
  ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="台灣廣播 PWA — Hit FM / Pop Radio / KISS Radio" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="台灣廣播" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" />
  <!-- Apple Touch Icon (可自行替換 icon.png) -->
  <link rel="apple-touch-icon" href="./icon.png" />

  <title>台灣廣播 — 線上收聽</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>

  <style>
    /* ── 自訂字型與全域變數 ── */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap');

    :root {
      --bg-primary:   #0f172a;
      --bg-card:      #1e293b;
      --bg-hover:     #334155;
      --accent:       #38bdf8;
      --accent-glow:  rgba(56,189,248,0.25);
      --text-primary: #f1f5f9;
      --text-muted:   #94a3b8;
      --hit-color:    #f472b6;   /* Hit FM — 粉紅 */
      --pop-color:    #a78bfa;   /* Pop Radio — 紫 */
      --kiss-color:   #34d399;   /* KISS Radio — 綠 */
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* 卡片底色 */
    .card { background: var(--bg-card); border-radius: 1rem; }

    /* 選中電台按鈕光暈效果 */
    .station-btn.active-hit  { border-color: var(--hit-color);  box-shadow: 0 0 18px rgba(244,114,182,0.4); }
    .station-btn.active-pop  { border-color: var(--pop-color);  box-shadow: 0 0 18px rgba(167,139,250,0.4); }
    .station-btn.active-kiss { border-color: var(--kiss-color); box-shadow: 0 0 18px rgba(52,211,153,0.4);  }

    .station-btn {
      transition: border-color 0.3s, box-shadow 0.3s, background 0.2s;
      border: 2px solid transparent;
    }
    .station-btn:hover { background: var(--bg-hover); }

    /* 播放動畫波形 */
    @keyframes barPulse {
      0%, 100% { transform: scaleY(0.3); }
      50%       { transform: scaleY(1);   }
    }
    .bar { display: inline-block; width: 4px; height: 20px; border-radius: 2px; transform-origin: bottom; }
    .bar-1 { animation: barPulse 0.9s ease-in-out infinite;       }
    .bar-2 { animation: barPulse 0.9s ease-in-out 0.15s infinite; }
    .bar-3 { animation: barPulse 0.9s ease-in-out 0.3s infinite;  }
    .bar-4 { animation: barPulse 0.9s ease-in-out 0.45s infinite; }
    .bars-paused .bar { animation-play-state: paused; }

    /* 音量滑桿自訂外觀 */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* 淡入動畫 */
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .fade-in { animation: fadeIn 0.4s ease both; }

    /* Toast 通知 */
    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid #334155;
      color: #f1f5f9; padding: 0.6rem 1.4rem; border-radius: 2rem;
      font-size: 0.85rem; pointer-events: none;
      transition: opacity 0.4s; opacity: 0; z-index: 999;
    }
    #toast.show { opacity: 1; }

    /* Spinner 微動畫 */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; display: inline-block; }
  </style>
</head>

<!-- ══════════════════════════════════════════
     ⑤ JavaScript — 核心邏輯
══════════════════════════════════════════ -->
<script>
/* ─────────────────────────────────────────
   【0】版本號
   每次修改程式後請遞增此版號（語意化版本：主版.次版.修訂）
   同時須同步修改 sw.js 中的 CACHE_NAME，
   以強制所有裝置清除舊快取、載入最新程式碼。
   目前版本：v0.0.1
───────────────────────────────────────────*/
const APP_VERSION = '0.0.1';

// 顯示版本號於頁尾
document.getElementById('versionDisplay').textContent = 'v' + APP_VERSION;

/* ─────────────────────────────────────────
   【1】電台資料定義
   streamUrls: 依序嘗試的備用 URL 陣列（第一個失敗自動試下一個）
   radioBrowserName: 用於查詢 radio-browser.info 公開 API 的搜尋關鍵字
                     作為最終動態備援（所有硬編碼 URL 都失敗時才觸發）
   ★ 如何新增備用 URL：
     直接在對應電台的 streamUrls 陣列最前面插入新 URL 即可。
───────────────────────────────────────────*/
const STATIONS = {
  hit: {
    id: 'hit',
    name: 'Hit FM 聯播網',
    freq: 'FM 107.7',
    colorClass: 'text-pink-400',
    activeClass: 'active-hit',
    btnId: 'btn-hit',
    radioBrowserName: 'Hit FM',
    streamUrls: []
  },

  pop: {
    id: 'pop',
    name: 'Pop Radio 91.7',
    freq: 'FM 91.7',
    colorClass: 'text-violet-400',
    activeClass: 'active-pop',
    btnId: 'btn-pop',
    radioBrowserName: 'POP Radio',
    streamUrls: []
  },

  kiss: {
    id: 'kiss',
    name: 'KISS Radio',
    freq: 'FM 99.9',
    colorClass: 'text-emerald-400',
    activeClass: 'active-kiss',
    btnId: 'btn-kiss',
    radioBrowserName: 'KISS Radio Taiwan',
    streamUrls: []
  }
};

/* ─────────────────────────────────────────
   【2】全域狀態 & LocalStorage
───────────────────────────────────────────*/
let currentStation = null;    // 目前選中的電台 ID
let isPlaying      = false;   // 播放中？
let isMuted        = false;   // 靜音中？
let records        = [];      // 收聽記錄陣列（與 LocalStorage 同步）

// DOM 參考
const audio       = document.getElementById('radioAudio');
const playIcon    = document.getElementById('playIcon');
const muteIcon    = document.getElementById('muteIcon');
const visualizer  = document.getElementById('visualizer');
const stationName = document.getElementById('stationName');
const stationFreq = document.getElementById('stationFreq');
const statusText  = document.getElementById('statusText');
const volSlider   = document.getElementById('volSlider');
const volDisplay  = document.getElementById('volDisplay');

/* ─────────────────────────────────────────
   【3】初始化：讀取 LocalStorage
───────────────────────────────────────────*/
function init() {
  // 讀取收聽記錄
  const savedRecords = localStorage.getItem('tw_radio_records');
  if (savedRecords) {
    try { records = JSON.parse(savedRecords); } catch(e) { records = []; }
  }

  // 讀取 GitHub 設定
  loadSettings();

  // 還原音量
  const savedVol = localStorage.getItem('tw_radio_volume');
  if (savedVol) {
    audio.volume = parseInt(savedVol) / 100;
    volSlider.value = savedVol;
    volDisplay.textContent = savedVol + '%';
  } else {
    audio.volume = 0.8;
  }

  // 渲染記錄列表
  renderRecords();
}

/* ─────────────────────────────────────────
   【4】電台選擇
───────────────────────────────────────────*/
function selectStation(id) {
  // 移除所有 active 樣式
  Object.values(STATIONS).forEach(s => {
    document.getElementById(s.btnId).classList.remove('active-hit','active-pop','active-kiss');
  });

  currentStation = id;
  const station  = STATIONS[id];

  // 套用 active 樣式
  document.getElementById(station.btnId).classList.add(station.activeClass);

  // 更新顯示資訊
  stationName.textContent = station.name;
  stationName.className   = `text-xl font-bold tracking-wide ${station.colorClass}`;
  stationFreq.textContent = station.freq;
  statusText.textContent  = '電台已選擇，按播放開始收聽';

  // 若已在播放，立即切換
  if (isPlaying) {
    loadAndPlay(station);
  }
}

/* ─────────────────────────────────────────
   【5】播放 / 暫停切換
───────────────────────────────────────────*/
function togglePlay() {
  if (!currentStation) {
    showToast('請先選擇一個電台 🎙️');
    return;
  }

  if (isPlaying) {
    pauseRadio();
  } else {
    loadAndPlay(STATIONS[currentStation]);
  }
}

// 載入並播放（含自動備援邏輯）
async function loadAndPlay(station) {
  // 先嘗試本機快取的可用 URL（上次成功的那個）
  const cachedUrl = localStorage.getItem('tw_radio_url_' + station.id);
  let urlsToTry = [...station.streamUrls];  // 複製備用清單
  if (cachedUrl && !urlsToTry.includes(cachedUrl)) {
    urlsToTry.unshift(cachedUrl);  // 快取 URL 優先嘗試
  } else if (cachedUrl) {
    // 把快取的移到最前面
    urlsToTry = [cachedUrl, ...urlsToTry.filter(u => u !== cachedUrl)];
  }

  statusText.textContent = '⏳ 連線中…';

  // ── 依序嘗試每個 URL ──
  for (let i = 0; i < urlsToTry.length; i++) {
    const url = urlsToTry[i];
    statusText.textContent = `⏳ 嘗試連線 (${i + 1}/${urlsToTry.length})…`;
    const ok = await tryPlayUrl(url, station);
    if (ok) {
      // 成功：把這個 URL 存入快取供下次優先使用
      localStorage.setItem('tw_radio_url_' + station.id, url);
      return;
    }
  }

  // ── 所有硬編碼 URL 都失敗 → 查詢 radio-browser.info API ──
  statusText.textContent = '🔍 查詢線上電台資料庫…';
  const urls = await fetchRadioBrowserUrls(station.radioBrowserName);

  for (const apiUrl of urls) {
    const ok = await tryPlayUrl(apiUrl, station);

    if (ok) {
      localStorage.setItem('tw_radio_url_' + station.id, apiUrl);
      return;
    }
  }

  // ── 全部失敗 ──
  statusText.textContent = '❌ 無法連線，請稍後再試';
  showToast('所有串流均失敗，請稍後再試或到官網收聽 📻');
  setPlayingState(false);
}

// 嘗試單一 URL，回傳 true（成功）或 false（失敗）
function tryPlayUrl(url, station) {
  return new Promise(resolve => {
    // 設定 5 秒超時
    const timeout = setTimeout(() => {
      audio.pause();
      audio.src = '';
      resolve(false);
    }, 15000);

    audio.src = url;
    audio.load();

    const onPlay = () => {
      clearTimeout(timeout);
      cleanup();
      setPlayingState(true);
      statusText.textContent = '🔴 直播中';
      addRecord(station);
      resolve(true);
    };

    const onError = () => {
      clearTimeout(timeout);
      cleanup();
      resolve(false);
    };

    const cleanup = () => {
      audio.removeEventListener('playing', onPlay);
      audio.removeEventListener('error',   onError);
    };

    audio.addEventListener('playing', onPlay,   { once: true });
    audio.addEventListener('error',   onError,  { once: true });

    audio.play().catch(() => {
      // play() rejected 不代表串流壞掉（可能只是 autoplay policy）
      // 交給 error 事件處理，這裡不提前 resolve
    });
  });
}

// 查詢 radio-browser.info 取得動態串流 URL
async function fetchRadioBrowserUrls(keyword) {

  const encoded = encodeURIComponent(keyword);

  const endpoint =
    `https://de1.api.radio-browser.info/json/stations/search?name=${encoded}&countrycode=TW&hidebroken=true&limit=30`;

  try {

    const res = await fetch(endpoint);

    if (!res.ok) {
      return [];
    }

    const data = await res.json();

    return data
      .filter(x => x.url_resolved)
      .map(x => x.url_resolved)
      .filter(url => url.startsWith('https://'));

  } catch (e) {

    console.error(e);

    return [];
  }
}


// 暫停
function pauseRadio() {
  audio.pause();
  setPlayingState(false);
  statusText.textContent = '已暫停';
}

// 更新 UI 播放狀態
function setPlayingState(playing) {
  isPlaying = playing;
  if (playing) {
    playIcon.className = 'ph-fill ph-pause';
    visualizer.classList.remove('bars-paused');
  } else {
    playIcon.className = 'ph-fill ph-play';
    visualizer.classList.add('bars-paused');
  }
}

/* ─────────────────────────────────────────
   【6】音量控制
───────────────────────────────────────────*/
function changeVolume(val) {
  const v = parseInt(val);
  audio.volume = v / 100;
  volDisplay.textContent = v + '%';
  localStorage.setItem('tw_radio_volume', val);

  // 更新靜音 icon
  if (v === 0) {
    muteIcon.className = 'ph ph-speaker-none';
    isMuted = true;
  } else if (v < 50) {
    muteIcon.className = 'ph ph-speaker-low';
    isMuted = false;
  } else {
    muteIcon.className = 'ph ph-speaker-high';
    isMuted = false;
  }
}

// 靜音切換
let volumeBeforeMute = 80;
function toggleMute() {
  if (isMuted) {
    // 取消靜音
    const v = volumeBeforeMute;
    audio.volume = v / 100;
    volSlider.value = v;
    volDisplay.textContent = v + '%';
    muteIcon.className = 'ph ph-speaker-high';
    isMuted = false;
  } else {
    // 靜音
    volumeBeforeMute = parseInt(volSlider.value);
    audio.volume = 0;
    volSlider.value = 0;
    volDisplay.textContent = '0%';
    muteIcon.className = 'ph ph-speaker-none';
    isMuted = true;
  }
}

/* ─────────────────────────────────────────
   【7】收聽記錄 (records 陣列 ↔ LocalStorage)
───────────────────────────────────────────*/
function addRecord(station) {
  const now = new Date();
  const record = {
    id:      Date.now(),
    station: station.name,
    freq:    station.freq,
    time:    now.toLocaleString('zh-TW', { hour12: false }),
  };

  records.unshift(record);       // 最新放最前
  if (records.length > 50) records.pop();  // 最多保留 50 筆

  // 同步至 LocalStorage
  localStorage.setItem('tw_radio_records', JSON.stringify(records));

  // 渲染 UI
  renderRecords();

  // 自動同步至 GitHub（若已設定）
  putGitHubData();
}

function renderRecords() {
  const container = document.getElementById('recordsList');
  if (!records.length) {
    container.innerHTML = '<p class="text-center text-slate-600 text-sm py-4">尚無記錄</p>';
    return;
  }

  container.innerHTML = records.slice(0, 10).map(r => `
    <div class="card px-4 py-3 flex items-center gap-3 fade-in">
      <i class="ph ph-radio text-sky-400 text-lg flex-shrink-0"></i>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium truncate">${escapeHtml(r.station)}</p>
        <p class="text-xs text-slate-500">${escapeHtml(r.freq)}</p>
      </div>
      <span class="text-xs text-slate-600 flex-shrink-0">${escapeHtml(r.time)}</span>
    </div>
  `).join('');
}

function clearRecords() {
  if (!confirm('確定要清除所有收聽記錄嗎？')) return;
  records = [];
  localStorage.removeItem('tw_radio_records');
  renderRecords();
  showToast('記錄已清除');
  putGitHubData();   // 同步清空至 GitHub
}

/* ─────────────────────────────────────────
   【8】GitHub 雲端同步
   fetchGitHubData()  — 從 GitHub 下載資料
   putGitHubData()    — 上傳資料至 GitHub
───────────────────────────────────────────*/

// 取得 GitHub 設定
function getGHConfig() {
  return {
    token: document.getElementById('ghToken').value.trim(),
    owner: document.getElementById('ghOwner').value.trim(),
    repo:  document.getElementById('ghRepo').value.trim(),
    path:  document.getElementById('ghPath').value.trim() || 'data/records.json',
  };
}

// 儲存設定至 LocalStorage（敏感資料僅存本機）
function saveSettings() {
  const cfg = getGHConfig();
  localStorage.setItem('tw_radio_gh_config', JSON.stringify({
    owner: cfg.owner,
    repo:  cfg.repo,
    path:  cfg.path,
    // 注意：Token 也存本機 LocalStorage，使用者需自行評估安全性
    token: cfg.token,
  }));
}

// 讀取設定
function loadSettings() {
  const saved = localStorage.getItem('tw_radio_gh_config');
  if (!saved) return;
  try {
    const cfg = JSON.parse(saved);
    document.getElementById('ghToken').value = cfg.token || '';
    document.getElementById('ghOwner').value = cfg.owner || '';
    document.getElementById('ghRepo').value  = cfg.repo  || '';
    document.getElementById('ghPath').value  = cfg.path  || 'data/records.json';
  } catch(e) {}
}

/**
 * fetchGitHubData() — 從 GitHub 下載 records 並合併
 */
async function fetchGitHubData() {
  const cfg = getGHConfig();
  if (!cfg.token || !cfg.owner || !cfg.repo) {
    showToast('請先填寫 GitHub 設定 ⚙️');
    return;
  }

  const syncBtn = document.getElementById('syncBtn');
  syncBtn.innerHTML = '<i class="ph ph-circle-notch spinner"></i>';

  const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;

  try {
    const res = await fetch(apiUrl, {
      headers: {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github.v3+json',
      }
    });

    if (res.status === 404) {
      showToast('遠端尚無資料，將在上傳時建立');
      return;
    }

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data    = await res.json();
    const decoded = atob(data.content.replace(/\n/g, ''));  // Base64 解碼
    const remote  = JSON.parse(decoded);

    // 以遠端資料覆蓋本機（可依需求改為合併邏輯）
    if (Array.isArray(remote)) {
      records = remote;
      localStorage.setItem('tw_radio_records', JSON.stringify(records));
      renderRecords();
      showToast(`已從 GitHub 下載 ${records.length} 筆記錄 ☁️`);
    }
  } catch(err) {
    console.error('fetchGitHubData 失敗：', err);
    showToast('下載失敗：' + err.message);
  } finally {
    syncBtn.innerHTML = '<i class="ph ph-cloud-arrow-up"></i>';
  }
}

/**
 * putGitHubData() — 上傳 records 至 GitHub
 * 若檔案不存在則建立，若已存在則更新（需傳入 SHA）
 */
async function putGitHubData() {
  const cfg = getGHConfig();
  if (!cfg.token || !cfg.owner || !cfg.repo) return;  // 未設定則靜默跳過

  const apiUrl  = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(records, null, 2))));  // UTF-8 Base64 編碼

  try {
    // 先取得現有 SHA（若檔案存在）
    let sha = null;
    const checkRes = await fetch(apiUrl, {
      headers: {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github.v3+json',
      }
    });
    if (checkRes.ok) {
      const checkData = await checkRes.json();
      sha = checkData.sha;
    }

    // PUT 請求建立或更新
    const body = {
      message: `📻 Update radio records [${new Date().toISOString()}]`,
      content,
      ...(sha ? { sha } : {}),     // 更新時須帶 SHA
    };

    const putRes = await fetch(apiUrl, {
      method:  'PUT',
      headers: {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });

    if (!putRes.ok) throw new Error(`HTTP ${putRes.status}`);

    showToast('已同步至 GitHub ✅');
  } catch(err) {
    console.error('putGitHubData 失敗：', err);
    // 靜默失敗，不打擾使用者
  }
}

// 手動觸發同步（導覽列雲端按鈕）
function triggerSync() {
  putGitHubData();
}

/* ─────────────────────────────────────────
   【9】UI 輔助功能
───────────────────────────────────────────*/

// 設定面板開關
function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('hidden');
}

// Toast 通知
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

// HTML 轉義（防 XSS）
function escapeHtml(str) {
  const div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

/* ─────────────────────────────────────────
   【10】Audio 事件監聽
───────────────────────────────────────────*/
audio.addEventListener('waiting', () => {
  statusText.textContent = '⏳ 緩衝中…';
});

audio.addEventListener('playing', () => {
  statusText.textContent = '🔴 直播中';
  setPlayingState(true);
});

audio.addEventListener('error', () => {
  statusText.textContent = '❌ 串流連線失敗';
  setPlayingState(false);
  showToast('串流連線失敗，請稍後重試');
});

audio.addEventListener('ended', () => {
  statusText.textContent = '已停止';
  setPlayingState(false);
});

───────────────────────────────────────────*/

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg  => console.log('✅ SW 已註冊：', reg.scope))
      .catch(err => console.warn('⚠️ SW 註冊失敗：', err));
  });
}

init();
